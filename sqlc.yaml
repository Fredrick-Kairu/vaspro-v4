version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/identity/store/queries"
    schema: "migrations/identity"
    gen:
      go:
        package: "store"
        out: "internal/identity/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        output_db_file_name: "db_gen.go"
        output_models_file_name: "models_gen.go"
        output_files_suffix: "_gen"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
            nullable: false
