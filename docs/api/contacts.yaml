    SegmentFilter:
      type: object
      description: >-
        A group, {"all": [...]} or {"any": [...]}, of conditions {"field", "op", "value"} and at most
        one more level of groups; at most 20 conditions. Fields: first_name, last_name, email (ignoring
        case), created_at (a date in the account's time zone), group, and attributes.<key>. Operators
        by type: text eq, neq, in, contains, starts_with, exists; number eq, neq, gt, gte, lt, lte, between,
        exists; date eq, before, after, between, exists; boolean eq, exists; group in, not_in. Text comparisons
        are exact (case-sensitive) except email; neq and the comparisons need a value, so a contact without
        one doesn't match; not_in matches a contact in no group. Values suit their field: text of 1 to
        255 characters, numbers as JSON numbers or decimal text, dates as YYYY-MM-DD, true or false, group
        IDs; in, not_in take a list of 1 to 100, between two (inclusive). At most 16 KB (data model §10).
      x-go-type: json.RawMessage
    SegmentCreateRequest:
      type: object
      required:
      - name
      - filter
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        filter:
          "$ref": "#/components/schemas/SegmentFilter"
      example:
        name: Nairobi regulars
        filter:
          all:
          - field: attributes.county
            op: eq
            value: Nairobi
          - any:
            - field: group
              op: in
              value:
              - '0193a1b2-7f00-7000-8000-0000000000b1'
            - field: attributes.visits
              op: gte
              value: 3
    SegmentUpdateRequest:
