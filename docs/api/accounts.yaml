openapi: 3.1.0
info:
  title: VASPRO accounts API
  version: "1"
  description: >
    Client accounts (tenants), their members and verification tiers
    (data model §4, system design §2). Every operation is reached
    through the gateway, which checks the dashboard session
    (sessionBearer) before accounts sees the request (task 2.2a).
servers:
  - url: /
paths:
  /v1/accounts/tenants:
    post:
      operationId: createTenant
      summary: Create a client account
      description: >
        Onboarding's "create your account" step, called after the user
        has signed up and verified their email (decision of 30 Oct,
        2.2's Q1). Creates a direct account in the sandbox tier, with
        the caller as its Admin. Currency, time zone and data region
        come from the country's pack; an unsupported country is
        VAL-4000.
      security:
        - sessionBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
            example:
              display_name: "Acme Deliveries"
              country_code: "KE"
              legal_name: "Acme Deliveries Limited"
              billing_email: "billing@acme.example"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        "400":
          $ref: '#/components/responses/Problem'
        "401":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/accounts/tenants/{id}:
    get:
      operationId: getTenant
      summary: Show a client account the caller belongs to
      description: >
        The caller must be an active member of the account, or, for a
        sub-account, an active member of its reseller (task 2.2b).
        VAL-4003 when the account doesn't exist or the caller can't see
        it, alike.
      security:
        - sessionBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        "401":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/accounts/tenants/{id}/sub-accounts:
    post:
      operationId: createSubAccount
      summary: Create a sub-account under a reseller
      description: >
        A reseller's member creates an account for one of the reseller's
        clients (task 2.2b). The sub-account starts in the sandbox tier
        and earns tiers through its own verification. Needs
        account:manage in the reseller (AUTH-4024 otherwise). It takes the
        reseller's country, currency, time zone and data region. The
        reseller's members reach it through the reseller; it gets no
        members of its own until it invites them. The reseller must be
        active and on the Financial tier: KYC-4021 when the account
        isn't an active reseller, KYC-4020 when a reseller has dropped
        below Financial. VAL-4003 when the caller isn't a member.
      security:
        - sessionBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubAccountCreateRequest'
            example:
              display_name: "Kilimo Traders"
              legal_name: "Kilimo Traders Limited"
      responses:
        "201":
          description: Sub-account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        "400":
          $ref: '#/components/responses/Problem'
        "401":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listSubAccounts
      summary: List a reseller's sub-accounts
      description: >
        Oldest first. The caller must be an active member of the
        account; VAL-4003 otherwise. An account that isn't a reseller
        has none.
      security:
        - sessionBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        "200":
          description: The sub-accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubAccountList'
        "401":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/accounts/roles:
    get:
      operationId: listRoles
      summary: List the built-in roles and their permissions
      description: >
        Admin, Developer, Finance and Viewer (task 2.3a). Admin's
        permissions are ["*"], every permission now and later.
      security:
        - sessionBearer: []
      responses:
        "200":
          description: The roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        "401":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/accounts/me/memberships:
    get:
      operationId: listMyMemberships
      summary: List the accounts the caller belongs to
      description: >
        Every account the caller is an active or invited member of, with
        their role: one email can belong to several accounts (system
        design §2). Sub-accounts reached only through a reseller aren't
        listed; list them from the reseller.
      security:
        - sessionBearer: []
      responses:
        "200":
          description: The caller's memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMembershipList'
        "401":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/accounts/tenants/{id}/members:
    get:
      operationId: listMembers
      summary: List an account's members
      description: >
        Active and invited members, oldest first; removed members aren't
        shown. Needs members:read. VAL-4003 when the caller isn't a
        member; AUTH-4024 when their role doesn't allow it.
      security:
        - sessionBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        "401":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/accounts/tenants/{id}/members/{userId}:
    patch:
      operationId: updateMember
      summary: Change a member's role
      description: >
        Needs members:manage. Only built-in roles can be assigned. An
        account always keeps an active Admin: demoting the last one is
        VAL-4004.
      security:
        - sessionBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdateRequest'
            example:
              role_id: "019a0000-0000-7000-8000-000000000002"
      responses:
        "200":
          description: The member with their new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        "400":
          $ref: '#/components/responses/Problem'
        "401":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeMember
      summary: Remove a member, or leave an account
      description: >
        Needs members:manage, except that anyone may remove themselves
        (leave). The last active Admin can't be removed or leave
        (VAL-4004). A removed member loses access at once, including to
        the account's API clients and SMPP accounts.
      security:
        - sessionBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "204":
          description: Removed.
        "401":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/accounts/tenants/{id}/invitations:
    post:
      operationId: createInvitation
      summary: Invite someone to an account by email
      description: >
        Needs members:manage and a fresh step-up (system design §3:
        adding users), AUTH-4012 otherwise. Identity finds the person
        or creates an unverified user for the address and emails the
        invitation, the same way whether or not the address was
        registered (task 2.3b). The membership is "invited" until they
        sign in and accept. Inviting someone already invited sends it
        again with the new role; inviting an active member is VAL-4005;
        a removed member can be invited again.
      security:
        - sessionBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
            example:
              email: "grace@example.com"
              role_id: "019a0000-0000-7000-8000-000000000002"
      responses:
        "201":
          description: Invited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        "400":
          $ref: '#/components/responses/Problem'
        "401":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/accounts/me/memberships/{tenantId}/acceptance:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: >
        The caller's invited membership becomes active (task 2.3b). Only
        an invitation can be accepted; anything else is VAL-4003. To
        decline, leave the account (removeMember on yourself).
      security:
        - sessionBearer: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          description: Now an active member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        "401":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
      description: >
        A dashboard session token (Authorization: Bearer
        <session_token>) from identity's sign-in. The gateway resolves
        it and forwards the user to accounts.
  parameters:
    TenantID:
      name: id
      in: path
      required: true
      schema:
        type: string
    UserID:
      name: userId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Required on every write (.claude/rules/api.md).
  responses:
    Problem:
      description: application/problem+json error (system design §8).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    TenantCreateRequest:
      type: object
      required: [display_name, country_code]
      properties:
        display_name:
          type: string
        country_code:
          type: string
          description: ISO 3166-1 alpha-2; must have a country pack (KE today).
        legal_name:
          type: string
        billing_email:
          type: string
    Role:
      type: object
      required: [id, name, permissions]
      properties:
        id:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
    RoleList:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    Member:
      type: object
      required: [user_id, role_id, status, created_at]
      properties:
        user_id:
          type: string
        role_id:
          type: string
        status:
          type: string
          enum: [invited, active]
        invited_by:
          type: string
        email:
          type: string
          description: From identity; left out if identity can't be reached.
        full_name:
          type: string
          description: From identity; empty until an invited person signs up.
        created_at:
          type: string
          format: date-time
    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    InvitationRequest:
      type: object
      required: [email, role_id]
      properties:
        email:
          type: string
        role_id:
          type: string
    MemberUpdateRequest:
      type: object
      required: [role_id]
      properties:
        role_id:
          type: string
    MyMembership:
      type: object
      required: [tenant_id, display_name, type, tier, role_id, status]
      properties:
        tenant_id:
          type: string
        display_name:
          type: string
        type:
          type: string
          enum: [direct, reseller, sub_account]
        tier:
          type: string
          enum: [sandbox, starter, business, financial]
        role_id:
          type: string
        status:
          type: string
          enum: [invited, active]
    MyMembershipList:
      type: object
      required: [memberships]
      properties:
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MyMembership'
    SubAccountCreateRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
        legal_name:
          type: string
        billing_email:
          type: string
    SubAccountList:
      type: object
      required: [sub_accounts]
      properties:
        sub_accounts:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
    Tenant:
      type: object
      required: [id, type, display_name, country_code, timezone, default_currency, region, tier, status, created_at]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [direct, reseller, sub_account]
        parent_tenant_id:
          type: string
        legal_name:
          type: string
        display_name:
          type: string
        country_code:
          type: string
        timezone:
          type: string
        default_currency:
          type: string
        region:
          type: string
          description: Data residency tag.
        tier:
          type: string
          enum: [sandbox, starter, business, financial]
        status:
          type: string
          enum: [active, suspended, archived]
        billing_email:
          type: string
        created_at:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status, code, detail, retryable]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        retryable:
          type: boolean
        request_id:
          type: string
