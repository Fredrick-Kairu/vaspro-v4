# A test-only country pack in UGX with VAT included, so tests (the
# property test's UGX wallets) can settle zero-exponent usage. This
# isn't Uganda's pack; that comes with Uganda's launch.
version: "test"
country_code: UG
timezone: Africa/Kampala
data_region: ke

currency:
  code: UGX
  exponent: 0

numbering:
  country_code: "256"
  trunk_prefix: "0"
  national_significant_number_length: 9

tax:
  vat_rate_basis_points: 1800
  vat_inclusive_by_default: true
  vat_effective_from: "2026-01-01"

send_windows:
  promotional:
    start: "08:00"
    end: "20:00"
    timezone: Africa/Kampala
