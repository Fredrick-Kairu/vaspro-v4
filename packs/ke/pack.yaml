# Kenya country pack, v0 (ROADMAP task 0.10 / Stage A item A6).
# Deliberately partial: only numbering, currency, tax and send windows —
# what task 0.10 asks for. operators, routes, rails, compliance_keywords
# and test_numbers are schema-optional and arrive with Stage A6's
# completion and Phase 7 (routes).

version: "0"
country_code: KE

# A new account's defaults (task 2.2a). data_region is the account's
# residency tag, fixed at creation (task 2.10); packs/schema.json lists
# the hosted regions (OD-02).
timezone: Africa/Nairobi
data_region: ke

currency:
  code: KES
  exponent: 2

numbering:
  country_code: "254"
  trunk_prefix: "0"
  national_significant_number_length: 9

tax:
  # 16%, VAT included by default (OD-06's default; data model's worked
  # example).
  vat_rate_basis_points: 1600
  vat_inclusive_by_default: true
  # The earliest date v4 settles usage at this rate (task 3.5, OQ-16);
  # Kenya's 16% itself is older. A new rate gets a new date.
  vat_effective_from: "2026-01-01"

send_windows:
  promotional:
    # system design §1's Kenya row: "Promotional SMS 8am-8pm; STOP on
    # every promotional message."
    start: "08:00"
    end: "20:00"
    timezone: Africa/Nairobi

# Business verification (task 2.7): profiles are checked against the
# Business Registration Service, by staff until a registry integration
# exists (OQ-08).
kyb:
  registry: BRS
  tax_id_label: KRA PIN
  # Uploaded before KYB can be submitted (task 2.8): the certificate of
  # incorporation, the KRA PIN certificate and proof of address.
  required_documents:
    - incorporation_cert
    - tax_certificate
    - proof_of_address

# Each service's minimum KYC tier in Kenya (task 2.4, OQ-06): the
# requirements' tier table. accounts syncs these into
# service_country_rules at startup.
services:
  sms:
    min_tier: starter
  surveys:
    min_tier: starter
  ussd:
    min_tier: starter
  whatsapp:
    min_tier: business
  rewards:
    min_tier: business
  payouts:
    min_tier: financial
  collections:
    min_tier: financial
