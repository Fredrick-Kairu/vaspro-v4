name: Daraja sandbox (nightly)

# Runs the Daraja adapter against Safaricom's real sandbox (task 4.2):
# OAuth, an STK push to the published sandbox test number, and STK
# queries. Never on a PR. The test skips until the DARAJA_SANDBOX_*
# repository secrets are set.

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC, 04:30 Nairobi
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sandbox:
    name: Daraja sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -tags=integration,daraja_sandbox
        env:
          DARAJA_SANDBOX_CONSUMER_KEY: ${{ secrets.DARAJA_SANDBOX_CONSUMER_KEY }}
          DARAJA_SANDBOX_CONSUMER_SECRET: ${{ secrets.DARAJA_SANDBOX_CONSUMER_SECRET }}
          DARAJA_SANDBOX_SHORTCODE: ${{ secrets.DARAJA_SANDBOX_SHORTCODE }}
          DARAJA_SANDBOX_PASSKEY: ${{ secrets.DARAJA_SANDBOX_PASSKEY }}
        run: go test -tags=integration,daraja_sandbox -run '^TestDarajaSandbox$' -count=1 -v ./internal/payments/adapters/
