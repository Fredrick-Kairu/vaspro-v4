# Dev environment: identity, accounts, the ledger, payments, webhooks and
# contacts behind the gateway, on a private network, for testers and the
# frontend team. Only three ports are published, on loopback: the gateway,
# Mailpit's web UI, and object storage for browsers' signed uploads
# (contacts' imports). The host's own nginx serves them on the API and
# mail domains (deploy/nginx/).
# See docs/runbooks/dev-environment.md.
#
#   deploy/compose/dev-secrets.sh   # once: creates .env with secrets
#   make dev-up
#
# The local stack for running services on the host is docker-compose.yml.
name: vaspro-dev

x-pg-superuser: &pg-superuser
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:-vaspro}
  PGPASSWORD: ${POSTGRES_PASSWORD:-vaspro}
  PGDATABASE: ${POSTGRES_DB:-vaspro}

# Services report ready on /readyz (dependencies reachable); /healthz is
# the liveness probe for an orchestrator later.
x-readyz-timing: &readyz-timing
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 10s

x-service: &service
  restart: unless-stopped
  networks: [vaspro-dev]

# A fixed subnet, so the address the gateway sees for requests through
# its published port is known: on a Linux host Docker forwards them from
# the network's first address (10.213.0.1), which GATEWAY_TRUSTED_PROXIES
# trusts. Docker never gives that address to a container.
networks:
  vaspro-dev:
    ipam:
      config:
        - subnet: ${DEV_SUBNET:-10.213.0.0/24}

services:
  # --- Infrastructure ------------------------------------------------------

  postgres:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaspro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaspro}
      POSTGRES_DB: ${POSTGRES_DB:-vaspro}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaspro} -d ${POSTGRES_DB:-vaspro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *service
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    <<: *service
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    <<: *service
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    # S3 on loopback, for the host's nginx: browsers post contacts' signed
    # upload forms to https://<API_DOMAIN>/contacts/, and nginx lets only
    # those POSTs through (deploy/nginx/).
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_HOST_PORT:-18333}:8333"
    volumes:
      - object-storage-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Webhooks' events table and reports (task 5.6).
  clickhouse:
    <<: *service
    image: clickhouse/clickhouse-server:24.3-alpine
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-vaspro}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-vaspro}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-vaspro}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s

  # About 1 GB of memory and a minute or two to load its signatures.
  clamav:
    <<: *service
    image: clamav/clamav:1.5.4-debian
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  mailpit:
    <<: *service
    image: axllent/mailpit:v1.20
    # The web UI and API only (not SMTP), on loopback, for the host's nginx.
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-18025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8025/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Database set-up (one-shot) -----------------------------------------

  db-setup:
    image: vaspro-dev/migrate
    build: { context: ../.., dockerfile: deploy/docker/migrate.Dockerfile }
    networks: [vaspro-dev]
    restart: "no"
    environment:
      <<: *pg-superuser
      IDENTITY_OWNER_PASSWORD: ${IDENTITY_OWNER_PASSWORD:?run deploy/compose/dev-secrets.sh}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?run deploy/compose/dev-secrets.sh}
      ACCOUNTS_OWNER_PASSWORD: ${ACCOUNTS_OWNER_PASSWORD:?run deploy/compose/dev-secrets.sh}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?run deploy/compose/dev-secrets.sh}
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:?run deploy/compose/dev-secrets.sh}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?run deploy/compose/dev-secrets.sh}
      PAYMENTS_OWNER_PASSWORD: ${PAYMENTS_OWNER_PASSWORD:?run deploy/compose/dev-secrets.sh}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?run deploy/compose/dev-secrets.sh}
      WEBHOOKS_OWNER_PASSWORD: ${WEBHOOKS_OWNER_PASSWORD:?run deploy/compose/dev-secrets.sh}
      WEBHOOKS_DB_PASSWORD: ${WEBHOOKS_DB_PASSWORD:?run deploy/compose/dev-secrets.sh}
      CONTACTS_OWNER_PASSWORD: ${CONTACTS_OWNER_PASSWORD:?run deploy/compose/dev-secrets.sh}
      CONTACTS_DB_PASSWORD: ${CONTACTS_DB_PASSWORD:?run deploy/compose/dev-secrets.sh}
      CLICKHOUSE_URL: clickhouse://${CLICKHOUSE_USER:-vaspro}:${CLICKHOUSE_PASSWORD:-vaspro}@clickhouse:9000/${CLICKHOUSE_DB:-vaspro}
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  # --- Services --------------------------------------------------------------

  identity:
    <<: *service
    image: vaspro-dev/identity
    build: { context: ../.., dockerfile: deploy/docker/identity.Dockerfile }
    environment:
      IDENTITY_DATABASE_URL: postgres://identity_app:${IDENTITY_DB_PASSWORD:?run deploy/compose/dev-secrets.sh}@postgres:5432/${POSTGRES_DB:-vaspro}?sslmode=disable&search_path=identity,public
      IDENTITY_NATS_URL: ${IDENTITY_NATS_URL:-nats://nats:4222}
      IDENTITY_HTTP_ADDR: ${IDENTITY_HTTP_ADDR:-:8080}
      IDENTITY_GRPC_ADDR: ${IDENTITY_GRPC_ADDR:-:9090}
      IDENTITY_ACCOUNTS_GRPC_ADDR: ${IDENTITY_ACCOUNTS_GRPC_ADDR:-accounts:9091}
      IDENTITY_SMTP_ADDR: ${IDENTITY_SMTP_ADDR:-mailpit:1025}
      IDENTITY_EMAIL_FROM: ${IDENTITY_EMAIL_FROM:-no-reply@vaspro.io}
      IDENTITY_TOTP_KMS_KEY: ${IDENTITY_TOTP_KMS_KEY:?run deploy/compose/dev-secrets.sh}
      IDENTITY_SIGNING_KEYS_KMS_KEY: ${IDENTITY_SIGNING_KEYS_KMS_KEY:?run deploy/compose/dev-secrets.sh}
      IDENTITY_CHALLENGE_SIGNING_KEY: ${IDENTITY_CHALLENGE_SIGNING_KEY:?run deploy/compose/dev-secrets.sh}
      IDENTITY_WEBAUTHN_RP_ID: ${IDENTITY_WEBAUTHN_RP_ID:-localhost}
      IDENTITY_WEBAUTHN_RP_DISPLAY_NAME: ${IDENTITY_WEBAUTHN_RP_DISPLAY_NAME:-VASPRO (dev)}
      IDENTITY_WEBAUTHN_ORIGINS: ${IDENTITY_WEBAUTHN_ORIGINS:-http://localhost:5173}
      IDENTITY_REDIS_URL: ${IDENTITY_REDIS_URL:-redis://redis:6379/0}
      IDENTITY_GOOGLE_CLIENT_ID: ${IDENTITY_GOOGLE_CLIENT_ID:-}
      IDENTITY_GOOGLE_CLIENT_SECRET: ${IDENTITY_GOOGLE_CLIENT_SECRET:-}
      IDENTITY_GOOGLE_REDIRECT_URL: ${IDENTITY_GOOGLE_REDIRECT_URL:-}
      IDENTITY_GOOGLE_ISSUER: ${IDENTITY_GOOGLE_ISSUER:-https://accounts.google.com}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/readyz || exit 1"]
      <<: *readyz-timing
    depends_on:
      db-setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }
      mailpit: { condition: service_healthy }

  accounts:
    <<: *service
    image: vaspro-dev/accounts
    build: { context: ../.., dockerfile: deploy/docker/accounts.Dockerfile }
    environment:
      ACCOUNTS_DATABASE_URL: postgres://accounts_app:${ACCOUNTS_DB_PASSWORD:?run deploy/compose/dev-secrets.sh}@postgres:5432/${POSTGRES_DB:-vaspro}?sslmode=disable&search_path=accounts,public
      ACCOUNTS_NATS_URL: ${ACCOUNTS_NATS_URL:-nats://nats:4222}
      ACCOUNTS_HTTP_ADDR: ${ACCOUNTS_HTTP_ADDR:-:8082}
      ACCOUNTS_GRPC_ADDR: ${ACCOUNTS_GRPC_ADDR:-:9091}
      ACCOUNTS_IDENTITY_GRPC_ADDR: ${ACCOUNTS_IDENTITY_GRPC_ADDR:-identity:9090}
      ACCOUNTS_KYC_PROVIDER: ${ACCOUNTS_KYC_PROVIDER:-fake}
      ACCOUNTS_KYC_FAKE_URL: ${ACCOUNTS_KYC_FAKE_URL:-http://kyc-vendor:8090}
      ACCOUNTS_KYC_WEBHOOK_SECRET: ${ACCOUNTS_KYC_WEBHOOK_SECRET:?run deploy/compose/dev-secrets.sh}
      ACCOUNTS_OBJECT_STORAGE_ENDPOINT: ${ACCOUNTS_OBJECT_STORAGE_ENDPOINT:-object-storage:8333}
      ACCOUNTS_OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-vaspro-local}
      ACCOUNTS_OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-vaspro-local-secret}
      ACCOUNTS_OBJECT_STORAGE_BUCKET: ${ACCOUNTS_OBJECT_STORAGE_BUCKET:-documents}
      ACCOUNTS_OBJECT_STORAGE_USE_TLS: ${ACCOUNTS_OBJECT_STORAGE_USE_TLS:-false}
      ACCOUNTS_DOCUMENTS_KMS_KEY: ${ACCOUNTS_DOCUMENTS_KMS_KEY:?run deploy/compose/dev-secrets.sh}
      ACCOUNTS_CLAMAV_ADDR: ${ACCOUNTS_CLAMAV_ADDR:-clamav:3310}
      ACCOUNTS_PACKS_DIR: ${ACCOUNTS_PACKS_DIR:-packs}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/readyz || exit 1"]
      <<: *readyz-timing
    depends_on:
      db-setup: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
      object-storage: { condition: service_healthy }
      clamav: { condition: service_healthy }

  ledger:
    <<: *service
    image: vaspro-dev/ledger
    build: { context: ../.., dockerfile: deploy/docker/ledger.Dockerfile }
    environment:
      LEDGER_DATABASE_URL: postgres://ledger_app:${LEDGER_DB_PASSWORD:?run deploy/compose/dev-secrets.sh}@postgres:5432/${POSTGRES_DB:-vaspro}?sslmode=disable&search_path=ledger,public
      LEDGER_NATS_URL: ${LEDGER_NATS_URL:-nats://nats:4222}
      LEDGER_HTTP_ADDR: ${LEDGER_HTTP_ADDR:-:8083}
      LEDGER_GRPC_ADDR: ${LEDGER_GRPC_ADDR:-:9092}
      LEDGER_IDENTITY_GRPC_ADDR: ${LEDGER_IDENTITY_GRPC_ADDR:-identity:9090}
      LEDGER_ACCOUNTS_GRPC_ADDR: ${LEDGER_ACCOUNTS_GRPC_ADDR:-accounts:9091}
      LEDGER_SETTLEMENT_WINDOW: ${LEDGER_SETTLEMENT_WINDOW:-5m}
      LEDGER_PACKS_DIR: ${LEDGER_PACKS_DIR:-packs}
      LEDGER_REBUILD_AT: ${LEDGER_REBUILD_AT:-21:30}
      LEDGER_DEV_TOPUPS: ${LEDGER_DEV_TOPUPS:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8083/readyz || exit 1"]
      <<: *readyz-timing
    depends_on:
      db-setup: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  payments:
    <<: *service
    image: vaspro-dev/payments
    build: { context: ../.., dockerfile: deploy/docker/payments.Dockerfile }
    environment:
      PAYMENTS_DATABASE_URL: postgres://payments_app:${PAYMENTS_DB_PASSWORD:?run deploy/compose/dev-secrets.sh}@postgres:5432/${POSTGRES_DB:-vaspro}?sslmode=disable&search_path=payments,public
      PAYMENTS_NATS_URL: ${PAYMENTS_NATS_URL:-nats://nats:4222}
      PAYMENTS_HTTP_ADDR: ${PAYMENTS_HTTP_ADDR:-:8084}
      PAYMENTS_REDIS_URL: ${PAYMENTS_REDIS_URL:-redis://redis:6379/2}
      PAYMENTS_ACCOUNTS_GRPC_ADDR: ${PAYMENTS_ACCOUNTS_GRPC_ADDR:-accounts:9091}
      PAYMENTS_IDENTITY_GRPC_ADDR: ${PAYMENTS_IDENTITY_GRPC_ADDR:-identity:9090}
      PAYMENTS_LEDGER_GRPC_ADDR: ${PAYMENTS_LEDGER_GRPC_ADDR:-ledger:9092}
      PAYMENTS_PACKS_DIR: ${PAYMENTS_PACKS_DIR:-packs}
      DARAJA_BASE_URL: ${DARAJA_BASE_URL:-https://sandbox.safaricom.co.ke}
      PAYMENTS_CREDENTIALS_KMS_KEY: ${PAYMENTS_CREDENTIALS_KMS_KEY:?run deploy/compose/dev-secrets.sh}
      PAYMENTS_CALLBACK_BASE_URL: ${PAYMENTS_CALLBACK_BASE_URL:?set it to https://<API_DOMAIN> in deploy/compose/.env}
      PAYMENTS_CALLBACK_SECRET: ${PAYMENTS_CALLBACK_SECRET:?run deploy/compose/dev-secrets.sh}
      PAYMENTS_DARAJA_CALLBACK_CIDRS: ${PAYMENTS_DARAJA_CALLBACK_CIDRS:-}
      PAYMENTS_CHECKOUT_SECRET: ${PAYMENTS_CHECKOUT_SECRET:?run deploy/compose/dev-secrets.sh}
      PAYMENTS_CHECKOUT_BASE_URL: ${PAYMENTS_CHECKOUT_BASE_URL:-}
      PAYMENTS_STK_EXPIRY: ${PAYMENTS_STK_EXPIRY:-3m}
      PAYMENTS_STK_GIVE_UP: ${PAYMENTS_STK_GIVE_UP:-10m}
      PAYMENTS_SWEEP_INTERVAL: ${PAYMENTS_SWEEP_INTERVAL:-30s}
      PAYMENTS_STATEMENT_DUE: ${PAYMENTS_STATEMENT_DUE:-12h}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8084/readyz || exit 1"]
      <<: *readyz-timing
    depends_on:
      db-setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }

  webhooks:
    <<: *service
    image: vaspro-dev/webhooks
    build: { context: ../.., dockerfile: deploy/docker/webhooks.Dockerfile }
    environment:
      WEBHOOKS_DATABASE_URL: postgres://webhooks_app:${WEBHOOKS_DB_PASSWORD:?run deploy/compose/dev-secrets.sh}@postgres:5432/${POSTGRES_DB:-vaspro}?sslmode=disable&search_path=webhooks,public
      WEBHOOKS_NATS_URL: ${WEBHOOKS_NATS_URL:-nats://nats:4222}
      WEBHOOKS_HTTP_ADDR: ${WEBHOOKS_HTTP_ADDR:-:8085}
      WEBHOOKS_ACCOUNTS_GRPC_ADDR: ${WEBHOOKS_ACCOUNTS_GRPC_ADDR:-accounts:9091}
      WEBHOOKS_IDENTITY_GRPC_ADDR: ${WEBHOOKS_IDENTITY_GRPC_ADDR:-identity:9090}
      WEBHOOKS_SECRETS_KMS_KEY: ${WEBHOOKS_SECRETS_KMS_KEY:?run deploy/compose/dev-secrets.sh}
      WEBHOOKS_SECRET_FINGERPRINT_KEY: ${WEBHOOKS_SECRET_FINGERPRINT_KEY:?run deploy/compose/dev-secrets.sh}
      WEBHOOKS_ALLOW_INSECURE_URLS: ${WEBHOOKS_ALLOW_INSECURE_URLS:-false}
      WEBHOOKS_CLICKHOUSE_URL: clickhouse://${CLICKHOUSE_USER:-vaspro}:${CLICKHOUSE_PASSWORD:-vaspro}@clickhouse:9000/${CLICKHOUSE_DB:-vaspro}
      WEBHOOKS_PACKS_DIR: ${WEBHOOKS_PACKS_DIR:-packs}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8085/readyz || exit 1"]
      <<: *readyz-timing
    depends_on:
      db-setup: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  contacts:
    <<: *service
    image: vaspro-dev/contacts
    build: { context: ../.., dockerfile: deploy/docker/contacts.Dockerfile }
    environment:
      CONTACTS_DATABASE_URL: postgres://contacts_app:${CONTACTS_DB_PASSWORD:?run deploy/compose/dev-secrets.sh}@postgres:5432/${POSTGRES_DB:-vaspro}?sslmode=disable&search_path=contacts,public
      CONTACTS_NATS_URL: ${CONTACTS_NATS_URL:-nats://nats:4222}
      CONTACTS_HTTP_ADDR: ${CONTACTS_HTTP_ADDR:-:8086}
      CONTACTS_GRPC_ADDR: ${CONTACTS_GRPC_ADDR:-:9093}
      CONTACTS_ACCOUNTS_GRPC_ADDR: ${CONTACTS_ACCOUNTS_GRPC_ADDR:-accounts:9091}
      CONTACTS_PACKS_DIR: ${CONTACTS_PACKS_DIR:-packs}
      CONTACTS_OBJECT_STORAGE_ENDPOINT: ${CONTACTS_OBJECT_STORAGE_ENDPOINT:-object-storage:8333}
      CONTACTS_OBJECT_STORAGE_PUBLIC_ENDPOINT: ${CONTACTS_OBJECT_STORAGE_PUBLIC_ENDPOINT:?set it to <API_DOMAIN> in deploy/compose/.env}
      CONTACTS_OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-vaspro-local}
      CONTACTS_OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-vaspro-local-secret}
      CONTACTS_OBJECT_STORAGE_BUCKET: ${CONTACTS_OBJECT_STORAGE_BUCKET:-contacts}
      CONTACTS_OBJECT_STORAGE_USE_TLS: ${CONTACTS_OBJECT_STORAGE_USE_TLS:-false}
      CONTACTS_OBJECT_STORAGE_PUBLIC_USE_TLS: ${CONTACTS_OBJECT_STORAGE_PUBLIC_USE_TLS:-true}
      CONTACTS_CLAMAV_ADDR: ${CONTACTS_CLAMAV_ADDR:-clamav:3310}
      CONTACTS_FILES_KMS_KEY: ${CONTACTS_FILES_KMS_KEY:?run deploy/compose/dev-secrets.sh}
      CONTACTS_DOWNLOAD_KEY: ${CONTACTS_DOWNLOAD_KEY:?run deploy/compose/dev-secrets.sh}
      CONTACTS_DOWNLOAD_BASE_URL: ${CONTACTS_DOWNLOAD_BASE_URL:?set it to https://<API_DOMAIN> in deploy/compose/.env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8086/readyz || exit 1"]
      <<: *readyz-timing
    depends_on:
      db-setup: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
      object-storage: { condition: service_healthy }
      clamav: { condition: service_healthy }

  gateway:
    <<: *service
    image: vaspro-dev/gateway
    build: { context: ../.., dockerfile: deploy/docker/gateway.Dockerfile }
    environment:
      GATEWAY_HTTP_ADDR: ${GATEWAY_HTTP_ADDR:-:8081}
      GATEWAY_IDENTITY_BASE_URL: ${GATEWAY_IDENTITY_BASE_URL:-http://identity:8080}
      GATEWAY_IDENTITY_GRPC_ADDR: ${GATEWAY_IDENTITY_GRPC_ADDR:-identity:9090}
      GATEWAY_ACCOUNTS_BASE_URL: ${GATEWAY_ACCOUNTS_BASE_URL:-http://accounts:8082}
      GATEWAY_LEDGER_BASE_URL: ${GATEWAY_LEDGER_BASE_URL:-http://ledger:8083}
      GATEWAY_PAYMENTS_BASE_URL: ${GATEWAY_PAYMENTS_BASE_URL:-http://payments:8084}
      GATEWAY_WEBHOOKS_BASE_URL: ${GATEWAY_WEBHOOKS_BASE_URL:-http://webhooks:8085}
      GATEWAY_CONTACTS_BASE_URL: ${GATEWAY_CONTACTS_BASE_URL:-http://contacts:8086}
      GATEWAY_REDIS_URL: ${GATEWAY_REDIS_URL:-redis://redis:6379/1}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-}
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-10.213.0.1}
    # Loopback only: the host's nginx is the way in.
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-18080}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/readyz || exit 1"]
      <<: *readyz-timing
    depends_on:
      redis: { condition: service_healthy }
      identity: { condition: service_healthy }
      accounts: { condition: service_healthy }
      ledger: { condition: service_healthy }
      payments: { condition: service_healthy }
      webhooks: { condition: service_healthy }
      contacts: { condition: service_healthy }

  # --- Fakes and tools -------------------------------------------------------

  kyc-vendor:
    <<: *service
    image: vaspro-dev/kycvendor
    build: { context: ../.., dockerfile: deploy/docker/kycvendor.Dockerfile }
    environment:
      KYCVENDOR_ADDR: ${KYCVENDOR_ADDR:-:8090}
      KYCVENDOR_WEBHOOK_SECRET: ${ACCOUNTS_KYC_WEBHOOK_SECRET:?run deploy/compose/dev-secrets.sh}
      KYCVENDOR_WEBHOOK_URL: ${KYCVENDOR_WEBHOOK_URL:-http://gateway:8081/v1/accounts/kyc/webhooks/fake}
      KYCVENDOR_PUBLIC_URL: ${KYCVENDOR_PUBLIC_URL:-http://kyc-vendor:8090}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8090/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The operations CLI, run on demand:
  #   docker compose ... run --rm vaspro identity grant-staff -by <operator> <email>
  # and the payments commands (VASPRO's paybill), with the secret on stdin:
  #   docker compose ... run --rm -T vaspro payments set-rail-credential ...
  vaspro:
    image: vaspro-dev/vaspro
    build: { context: ../.., dockerfile: deploy/docker/vaspro.Dockerfile }
    profiles: [tools]
    networks: [vaspro-dev]
    environment:
      IDENTITY_DATABASE_URL: postgres://identity_app:${IDENTITY_DB_PASSWORD:?run deploy/compose/dev-secrets.sh}@postgres:5432/${POSTGRES_DB:-vaspro}?sslmode=disable&search_path=identity,public
      IDENTITY_SIGNING_KEYS_KMS_KEY: ${IDENTITY_SIGNING_KEYS_KMS_KEY:?run deploy/compose/dev-secrets.sh}
      PAYMENTS_DATABASE_URL: postgres://payments_app:${PAYMENTS_DB_PASSWORD:?run deploy/compose/dev-secrets.sh}@postgres:5432/${POSTGRES_DB:-vaspro}?sslmode=disable&search_path=payments,public
      PAYMENTS_IDENTITY_GRPC_ADDR: ${PAYMENTS_IDENTITY_GRPC_ADDR:-identity:9090}
      PAYMENTS_CREDENTIALS_KMS_KEY: ${PAYMENTS_CREDENTIALS_KMS_KEY:?run deploy/compose/dev-secrets.sh}
      PAYMENTS_CREDENTIAL_FINGERPRINT_KEY: ${PAYMENTS_CREDENTIAL_FINGERPRINT_KEY:?run deploy/compose/dev-secrets.sh}
      PAYMENTS_CALLBACK_BASE_URL: ${PAYMENTS_CALLBACK_BASE_URL:?set it to https://<API_DOMAIN> in deploy/compose/.env}
      PAYMENTS_CALLBACK_SECRET: ${PAYMENTS_CALLBACK_SECRET:?run deploy/compose/dev-secrets.sh}
      DARAJA_BASE_URL: ${DARAJA_BASE_URL:-https://sandbox.safaricom.co.ke}

volumes:
  postgres-data:
  redis-data:
